name: Bug report
description: Report something that isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        Please don't report security vulnerabilities here. Follow our security policy (SECURITY.md) instead.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short, clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include any error messages.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Web
        - Backend / API
        - Other
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Any details that might be relevant.
      placeholder: |
        App or service version:
        Device and OS version:
        Browser (for web):
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Screenshots or additional context
      description: Screenshots, recordings, logs or anything else that helps. Remove any personal data first.
    validations:
      required: false
