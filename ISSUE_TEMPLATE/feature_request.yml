name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short description of the feature or improvement.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: What problem does this solve, and for whom (customers, barber shops or the team)?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How do you think this could work? Rough ideas are fine.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Alternatives you've considered, mockups, examples or anything else that helps.
    validations:
      required: false
